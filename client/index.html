<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Siano</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header id="bar">
      <input id="trip-name" class="trip-name" type="text" placeholder="Untitled trip" autocomplete="off" />
      <div class="bar-right">
        <span id="net" class="net net--closed" title="sync status">offline</span>
        <button id="share" class="ghost" type="button" title="Copy trip link">link</button>
      </div>
    </header>

    <main id="app">
      <!-- The board renders here from the folded snapshot. -->
      <section id="board" class="board"></section>
    </main>

    <nav id="dock">
      <button id="add-member" type="button">+ Traveller</button>
      <button id="add-meal" type="button">+ Bill</button>
    </nav>

    <!-- App is plain ESM modules — no build step. -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
