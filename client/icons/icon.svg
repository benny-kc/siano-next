<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed amber background: fills the entire canvas so a maskable
       install (Android home screen) never shows white borders — any mask
       shape still lands on solid brand colour. -->
  <rect width="512" height="512" fill="#f59e0b"/>
  <!-- Briefcase, centred and enlarged. The whole figure (handle + body) is
       balanced around the canvas centre and kept inside the maskable safe
       zone (~central 80%), so it reads big without being clipped. -->
  <!-- handle -->
  <path d="M206 172 v-24 a18 18 0 0 1 18 -18 h64 a18 18 0 0 1 18 18 v24"
        fill="none" stroke="#0f172a" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- body -->
  <rect x="112" y="168" width="288" height="224" rx="36" fill="#0f172a"/>
  <!-- two straps -->
  <rect x="174" y="168" width="20" height="224" fill="#f59e0b"/>
  <rect x="318" y="168" width="20" height="224" fill="#f59e0b"/>
  <!-- clasp -->
  <rect x="232" y="146" width="48" height="18" rx="7" fill="#0f172a"/>
</svg>
